appId: app.wappflow.desktop
productName: WappFlow
copyright: Copyright © WappFlow

directories:
  output: dist
  buildResources: build

files:
  - "src/**/*"
  - "package.json"
  - "!src/main/ai/models/**"        # ONNX models are fetched/bundled per-channel, not from source

# Auto-update feed — Command Center governs version/force-update/rollouts (Phase 7).
# Points at the deployment domain; host latest.yml + installers under /desktop to
# activate updates (or switch provider to S3 / GitHub releases). Until then the
# client's checkForUpdates() fails silently (see main.js initAutoUpdate).
publish:
  - provider: generic
    url: https://wappflow.remoteops.co/desktop

win:
  target: [nsis]
  artifactName: "WappFlow-Setup-${version}.${ext}"
  # These builds are unsigned by decision (see /download, which explains the
  # resulting SmartScreen warning to the user before they click).
  #
  # signAndEditExecutable:false ALSO stops electron-builder fetching its
  # winCodeSign toolchain, which it cannot unpack on a stock Windows box: the
  # archive contains macOS symlinks (libcrypto.dylib, libssl.dylib) and Windows
  # refuses to create symlinks without elevation or Developer Mode. It retries
  # into a NEW random cache directory each run, so pre-extracting cannot win.
  # Since we are not signing, that whole toolchain is overhead.
  #
  # THE COST, stated: the .exe does not get its icon and version metadata
  # stamped by rcedit. There is no custom icon configured today, so nothing is
  # lost right now — but when a signing certificate is bought, set this back to
  # true (the default) and both signing and stamping return together.
  signAndEditExecutable: false
mac:
  target: [dmg]
  category: public.app-category.business
linux:
  target: [AppImage]
  category: Office

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
